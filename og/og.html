<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <style>
    @font-face {
      font-family: "Be Vietnam Pro";
      font-weight: 500;
      font-style: normal;
      src: url("../node_modules/@fontsource/be-vietnam-pro/files/be-vietnam-pro-vietnamese-500-normal.woff2") format("woff2");
    }
    @font-face {
      font-family: "Be Vietnam Pro";
      font-weight: 700;
      font-style: normal;
      src: url("../node_modules/@fontsource/be-vietnam-pro/files/be-vietnam-pro-vietnamese-700-normal.woff2") format("woff2");
    }
    html, body { margin: 0; padding: 0; }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #f3f4f6;
      color: #12141a;
      font-family: "Be Vietnam Pro", ui-sans-serif, system-ui, sans-serif;
      position: relative;
    }
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(18,20,26,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(18,20,26,.05) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .wrap {
      position: absolute;
      inset: 0;
      padding: 72px 80px 64px;
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 48px;
      align-items: center;
    }
    .kicker {
      margin: 0 0 18px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #0e6b63;
    }
    h1 {
      margin: 0 0 22px;
      font-size: 92px;
      line-height: .98;
      letter-spacing: -.04em;
      font-weight: 700;
    }
    .tag {
      margin: 0 0 32px;
      max-width: 640px;
      font-size: 28px;
      line-height: 1.35;
      font-weight: 500;
      color: #5c6370;
    }
    .host {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border: 1.5px solid #0e6b63;
      border-radius: 999px;
      color: #0e6b63;
      font-size: 20px;
      font-weight: 700;
    }
    .host::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #0e6b63;
    }
    .icon { display: grid; place-items: center; }
    .icon img {
      width: 240px;
      height: 240px;
      border-radius: 54px;
    }
    .foot {
      position: absolute;
      left: 80px;
      right: 80px;
      bottom: 40px;
      display: flex;
      justify-content: space-between;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #5c6370;
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div>
      <p class="kicker">Bộ gõ tiếng Việt · macOS</p>
      <h1>GõViệt</h1>
      <p class="tag">Gõ tiếng Việt trên macOS, theo cách bạn đã quen.</p>
      <span class="host">goviet.kynguyen.cc</span>
    </div>
    <div class="icon"><img src="../public/icon-192.png" alt=""></div>
  </div>
  <div class="foot">
    <span>kynguyen.cc</span>
    <span>Đà Nẵng · VN</span>
  </div>
</body>
</html>
